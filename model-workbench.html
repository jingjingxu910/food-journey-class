<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f8f6" />
    <title>消化模型工作台｜食物在身体里的旅行</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script defer src="model-workbench.js"></script>
  </head>
  <body class="model-page">
    <main class="model-app">
      <header class="model-topbar">
        <a class="model-back" href="index.html">← 课程首页</a>
        <div class="model-identity">
          <span id="connection-status" class="connection-status">本机记录</span>
          <strong id="group-badge">第 1 组</strong>
        </div>
      </header>

      <section id="student-view" class="model-student-view">
        <div class="model-heading">
          <div>
            <p id="phase-label" class="model-eyebrow">V1 · 初始模型</p>
            <h1 id="model-title">食物会怎样在身体里旅行？</h1>
            <p id="model-prompt">把器官自由摆到人体上，再直接画出食物经过的路线。这里不会提示对错。</p>
          </div>
          <div class="phase-track" aria-label="课堂进度">
            <span id="phase-v1" class="active">初次建模</span><i></i><span>AR观察</span><i></i><span id="phase-v2">证据修正</span>
          </div>
        </div>

        <section class="anatomy-workspace">
          <aside class="organ-shelf" aria-labelledby="shelf-title">
            <div><p class="model-eyebrow">器官区</p><h2 id="shelf-title">拖到人体上</h2><p>位置没有框，也不会自动吸附。</p></div>
            <div id="organ-palette" class="organ-palette"></div>
          </aside>

          <div class="body-stage-wrap">
            <div id="body-stage" class="body-stage" aria-label="人体消化模型画布">
              <img class="body-outline" src="assets/anatomy/body-outline.svg" alt="正面人体轮廓" draggable="false" />
              <canvas id="route-canvas" aria-label="食物旅行路线画布"></canvas>
              <div id="placed-organs" class="placed-organs"></div>
              <div id="draw-tip" class="draw-tip" hidden>从口腔开始，用一笔画出食物的旅行路线</div>
            </div>
          </div>

          <aside class="model-tools">
            <div class="task-card"><span id="placement-count">0 / 5</span><strong>器官已放置</strong><p id="task-hint">先把 5 个器官都放到你认为合适的位置。</p></div>
            <button id="draw-route-button" class="tool-button tool-button--primary" type="button" disabled>✎ 画食物路线</button>
            <button id="undo-button" class="tool-button" type="button">↶ 撤销上一步</button>
            <button id="clear-route-button" class="tool-button" type="button">清除路线</button>
          </aside>
        </section>

        <footer class="model-footer">
          <div><strong id="route-summary">等待画路线</strong><span id="save-status" role="status">系统会记录每次移动，不显示正确答案。</span></div>
          <button id="submit-model-button" class="submit-model-button" type="button">保存 V1 初始模型</button>
        </footer>
      </section>

      <section id="transition-panel" class="transition-panel" hidden></section>
      <section id="teacher-view" class="teacher-model-view" hidden>
        <div class="teacher-model-heading">
          <div><p class="model-eyebrow">教师端 · 实时数据</p><h1>12 个小组的模型变化</h1></div>
          <div><button id="refresh-dashboard" class="tool-button" type="button">刷新数据</button><button id="export-button" class="tool-button" type="button">导出本机记录</button></div>
        </div>
        <p class="teacher-note">每张图保留学生真实摆放位置与所画路线；系统只呈现变化，不替学生判分。</p>
        <div id="teacher-summary" class="teacher-summary"></div>
        <div id="group-dashboard" class="group-dashboard"></div>
      </section>
    </main>
  </body>
</html>
