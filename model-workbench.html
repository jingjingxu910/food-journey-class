<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#176a8c" />
    <title>二维模型工作台｜食物在身体里的旅行</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="site-topbar" aria-label="活动导航">
        <a class="back-link" href="index.html">← 课程首页</a>
        <button id="export-button" class="export-button" type="button">导出本机学习记录</button>
      </nav>
      <header class="hero lesson-hero model-hero">
        <p id="phase-label" class="eyebrow">V1 · 我的初始想法</p>
        <h1 id="model-title">先画出你的消化模型</h1>
        <p id="model-prompt" class="intro">把器官放到你认为正确的位置，再排出食物会经过的顺序。此时没有对错提示。</p>
      </header>

      <section id="student-code-card" class="student-code-card" aria-labelledby="code-title">
        <div><p class="board-kicker">开始前</p><h2 id="code-title">输入学习编号</h2><p>可使用座位号或教师分配的编号；不需要填写姓名。</p></div>
        <div class="code-entry"><input id="student-code" maxlength="12" placeholder="例如：4-01" autocomplete="off" /><button id="start-model-button" type="button">开始建模</button></div>
      </section>

      <section id="workbench" class="model-workbench" hidden>
        <div class="model-progress"><span id="position-step" class="is-active">1 · 器官位置</span><i></i><span id="route-step">2 · 食物路线</span><i></i><span id="revision-step">3 · 观察后修正</span></div>
        <section id="position-board" class="model-board">
          <div class="board-title"><div><p class="board-kicker">位置模型</p><h2>把器官放进人体图</h2></div><p>按住插图，拖到你认为合适的位置。</p></div>
          <div class="model-layout">
            <div id="body-model" class="scientific-body" aria-label="人体消化器官模型">
              <div class="scientific-head"></div><div class="scientific-neck"></div><div class="scientific-torso"></div>
              <div class="model-slot model-slot--mouth" data-board="position" data-slot="mouth"></div>
              <div class="model-slot model-slot--esophagus" data-board="position" data-slot="esophagus"></div>
              <div class="model-slot model-slot--stomach" data-board="position" data-slot="stomach"></div>
              <div class="model-slot model-slot--small-intestine" data-board="position" data-slot="small-intestine"></div>
              <div class="model-slot model-slot--large-intestine" data-board="position" data-slot="large-intestine"></div>
            </div>
            <div><p class="palette-label">拖动器官</p><div id="position-palette" class="image-palette"></div></div>
          </div>
        </section>

        <section id="route-board" class="model-board" hidden>
          <div class="board-title"><div><p class="board-kicker">路径模型</p><h2>排出食物旅行路线</h2></div><p>按住器官插图，依次放到 1—5 站。</p></div>
          <div class="route-layout"><div id="route-palette" class="image-palette"></div><div class="route-slots">
            <div class="route-slot" data-board="route" data-slot="1"><span>1</span></div><div class="route-slot" data-board="route" data-slot="2"><span>2</span></div><div class="route-slot" data-board="route" data-slot="3"><span>3</span></div><div class="route-slot" data-board="route" data-slot="4"><span>4</span></div><div class="route-slot" data-board="route" data-slot="5"><span>5</span></div>
          </div></div>
        </section>
        <p id="model-feedback" class="model-feedback" role="status"></p>
        <div class="model-actions"><button id="clear-button" class="secondary-button" type="button">清空当前步骤</button><button id="next-button" type="button">下一步：排列路线</button></div>
      </section>
      <section id="saved-panel" class="saved-panel" hidden></section>
    </main>
    <script defer src="model-workbench.js"></script>
  </body>
</html>
