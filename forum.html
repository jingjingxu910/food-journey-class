<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课后论坛 · 食物在身体里的旅行</title>
  <script src="frame-entry.js"></script>
  <script defer src="cloud-loader.js"></script>
  <link rel="stylesheet" href="forum.css?v=forum-club">
  <script type="module" src="forum.js?v=forum-club"></script>
</head>
<body>
  <main>
    <header class="forum-header">
      <div><h1>课后论坛</h1><p id="instructions">发帖分享你的发现，给有启发的帖子点赞，也可以留言提问。</p></div>
      <div class="header-actions"><p id="audience"></p>
      <button type="button" id="fullscreen">全屏</button>
      </div>
    </header>
    <nav id="topics" aria-label="论坛话题"></nav>
    <section class="topic-panel" aria-labelledby="topic-title">
      <h2 id="topic-title"></h2>
      <p id="question"></p>
      <div class="sprout-guide">
        <div class="sprout" aria-hidden="true"></div>
        <div class="sprout-bubble"><strong>小芽</strong><p id="prompt" aria-live="polite"></p></div>
      </div>
      <div id="composer"></div>
    </section>
    <section class="forum-board" aria-labelledby="board-title">
      <div class="board-heading"><h2 id="board-title">小组交流</h2><button type="button" id="refresh">刷新帖子</button></div>
      <p id="status" role="status"></p>
      <div id="threads"></div>
    </section>
  </main>
</body>
</html>
