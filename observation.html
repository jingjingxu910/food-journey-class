  <title>观察身体里的器官｜食物在身体里的旅行</title>

  <link rel="stylesheet" href="student-flow.css?v=20261031-1">
  <script defer src="cloud-loader.js?v=20261031-1"></script>

<body class="flow-page ar-page">
  <main class="flow-shell">
    <header class="flow-topbar"><a id="back-link" href="index.html">← 课堂首页</a><span id="group-label">第 1 组</span><button class="flow-fullscreen student-fullscreen" type="button">全屏</button></header>
    <div class="flow-heading"><span>观察</span><h1>透视身体，发现器官</h1></div>
    <section class="observation-layout">
      <div class="camera-panel">
        <div id="camera-stage" class="camera-stage">
          <video id="camera-video" autoplay muted playsinline></video>
            <dialog id="organ-dialog" class="organ-dialog"><svg id="organ-links" aria-hidden="true"></svg><header><h2 id="organ-dialog-title"></h2><button id="close-organ-dialog" type="button" aria-label="关闭观察窗口" title="关闭">×</button></header><div class="ar-view-tabs"><button id="show-organ-structure" type="button">三维结构</button><button id="show-organ-process" type="button">作用演示</button><button id="show-organ-media" type="button" hidden>真实内壁</button></div><div id="organ-3d"></div><canvas id="organ-process" hidden width="640" height="540"></canvas><div id="organ-media" hidden><video id="organ-video" controlslist="nofullscreen" muted playsinline controls preload="none" disablepictureinpicture controlslist="nodownload nofullscreen"></video><img id="organ-micrograph" hidden alt="真实回肠绒毛组织切片"><p id="organ-video-caption"></p></div><p id="organ-dialog-note"></p><footer><span>单指转动，双指放大</span><button id="reset-organ-view" class="flow-secondary" type="button">初始视角</button></footer><a id="organ-model-credit" class="ar-credit" href="ar-sources.html" target="_blank" rel="noopener">模型来源：BodyParts3D · DBCLS</a></dialog><details class="ar-calibration" hidden><summary>对齐与空间观察</summary><button id="reset-alignment" class="flow-secondary" type="button">重新对齐</button><button id="compare-airways" class="flow-secondary" type="button">比较两条通道</button><label><input type="checkbox" id="show-respiratory">显示气管和肺</label><label>转动观察<input id="anatomy-turn" type="range" min="-80" max="80" value="0"></label><label>大小<input id="anatomy-size" type="range" min="0.75" max="1.25" step="0.01" value="1"></label><label>左右微调<input id="anatomy-x" type="range" min="-70" max="70" value="0"></label><label>上下微调<input id="anatomy-y" type="range" min="-100" max="100" value="0"></label><p>面向镜头，让肩部和髋部进入画面。器官是解剖参考模型，位置为示意。</p></details><div id="anatomy-overlay"></div><div id="ar-organs" class="ar-organs" aria-label="人体器官叠加"></div>
          <div id="camera-placeholder" class="camera-placeholder"><span>◉</span><p>请一位同学站到镜头前</p></div>
      <aside class="observe-panel" hidden>
        <button id="close-discovery" type="button" class="flow-secondary">收起说明</button><p class="observe-prompt">我的发现</p>
        <div id="organ-list" class="observe-organ-list"></div>
        <div id="organ-detail" class="organ-detail" hidden></div>
        <button id="open-local-3d" class="flow-secondary" type="button" hidden>转动看看</button>

      </aside>
        </div>
        <div class="camera-actions"><button id="start-camera" class="flow-primary" type="button" disabled>开启后置相机</button><button id="cancel-camera" class="flow-secondary" type="button" hidden>取消开启</button><span id="camera-status" role="status">等待开启</span></div><p id="observation-status" class="flow-status" role="status"></p><button id="finish-observation" class="flow-primary" type="button" disabled>把观察发现提交给老师</button><output id="ar-metrics"></output>
      </div>

    </section>
  </main>

</body>
</html>
