<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#176a8c" />
    <title>器官拖放｜食物在身体里的旅行</title>
    <link rel="stylesheet" href="styles.css?v=20261028-1" />
    <script defer src="watermark.js?v=20261028-1"></script>
</head>
  <body class="student-page">
    <main class="app-shell">
      <nav class="site-topbar" aria-label="活动导航">
        <a class="back-link" href="index.html">← 课程首页</a>
        <span class="topbar-badge">任务 1 / 4</span>
      </nav>
      <header class="hero lesson-hero">
        <p class="eyebrow">任务 1 · 拖一拖，排一排</p>
        <h1>食物要经过哪些地方？</h1>
        <p class="intro">把下方器官拖到食物旅行的正确站点。</p>
      </header>

      <section class="drag-instructions" aria-label="操作说明">
        <span>1. 按住器官卡片</span>
        <span>2. 拖到一个空站点</span>
        <span>3. 全部完成后查看结果</span>
      </section>

      <section class="journey-board" aria-labelledby="journey-title">
        <div class="journey-heading">
          <div><p class="board-kicker">挑战路线</p><h2 id="journey-title">食物旅行路线</h2></div>
          <output id="progress-output">已完成 0 / 6 站</output>
        </div>
        <div class="journey-slots">
          <div class="organ-slot" data-organ="mouth"><span class="slot-number">第 1 站</span><span class="slot-placeholder">拖到这里</span></div>
          <div class="organ-slot" data-organ="esophagus"><span class="slot-number">第 2 站</span><span class="slot-placeholder">拖到这里</span></div>
          <div class="organ-slot" data-organ="stomach"><span class="slot-number">第 3 站</span><span class="slot-placeholder">拖到这里</span></div>
          <div class="organ-slot" data-organ="small-intestine"><span class="slot-number">第 4 站</span><span class="slot-placeholder">拖到这里</span></div>
          <div class="organ-slot" data-organ="large-intestine"><span class="slot-number">第 5 站</span><span class="slot-placeholder">拖到这里</span></div>
          <div class="organ-slot" data-organ="anus"><span class="slot-number">第 6 站</span><span class="slot-placeholder">拖到这里</span></div>
        </div>
      </section>

      <section class="organ-tray" aria-labelledby="tray-title">
        <div class="tray-heading"><div><p class="board-kicker">工具箱</p><h2 id="tray-title">器官卡片</h2></div><span>按住并拖动</span></div>
        <div id="organ-pieces" class="organ-pieces">
          <button class="organ-piece" type="button" data-organ="mouth">口腔</button>
          <button class="organ-piece" type="button" data-organ="esophagus">食道</button>
          <button class="organ-piece" type="button" data-organ="stomach">胃</button>
          <button class="organ-piece" type="button" data-organ="small-intestine">小肠</button>
          <button class="organ-piece" type="button" data-organ="large-intestine">大肠</button>
          <button class="organ-piece" type="button" data-organ="anus">肛门</button>
        </div>
      </section>

      <p id="drag-feedback" class="drag-feedback" role="status">准备好了吗？从任意一张器官卡片开始。</p>
      <button id="restart-button" class="restart-button" type="button">重新挑战</button>
    </main>
    <script defer src="organ-drag.js?v=20261028-1"></script>
  </body>
</html>
