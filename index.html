<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#176a8c" />
    <title>食物在身体里的旅行</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">四年级科学 · 课堂互动应用</p>
        <h1>食物在身体里的旅行</h1>
        <p class="intro">跟随食物，认识人体消化系统的奇妙旅程。</p>
      </header>

      <section class="lesson-status" aria-label="课堂开发进度">
        <span class="status-dot" aria-hidden="true"></span>
        <span>第一步：平板能力检测</span>
      </section>

      <section class="module-grid" aria-label="课堂模块">
        <a class="module-card module-card--active" href="device-check.html">
          <span class="module-number">01</span>
          <h2>设备检测</h2>
          <p>确认摄像头、人体识别和 3D 是否可用。</p>
          <span class="module-action">开始检测 →</span>
        </a>

        <article class="module-card module-card--locked">
          <span class="module-number">02</span>
          <h2>器官拖放</h2>
          <p>把消化器官放回正确的位置。</p>
          <span>即将制作</span>
        </article>

        <article class="module-card module-card--locked">
          <span class="module-number">03</span>
          <h2>人体 AR</h2>
          <p>在真人画面上叠加消化器官。</p>
          <span>即将制作</span>
        </article>

        <article class="module-card module-card--locked">
          <span class="module-number">04</span>
          <h2>3D 食物旅行</h2>
          <p>以第一人称走进人体消化通道。</p>
          <span>即将制作</span>
        </article>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
