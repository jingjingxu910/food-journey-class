<!doctype html>
<html lang="zh-CN">
  <head>

  <body class="home-page student-page">
    <main class="app-shell">
      <nav class="site-topbar" aria-label="课程导航">
        <a class="brand" href="index.html"><span>食物在身体里的旅行</span></a>
        <div class="home-actions"><span id="home-group-badge" class="topbar-badge" hidden></span><button id="fullscreen-button" class="topbar-badge" type="button">全屏</button></div>
      </nav>

      <header class="hero hero--home">
        <div class="hero-copy">
          <p class="eyebrow">四年级科学</p>
          <h1>食物在身体里的旅行</h1>
          <p class="intro">今天，我们通过模型、观察和拼装来研究这个问题。</p>
        </div>
        <div class="home-illustration" aria-hidden="true">食物的旅行</div>
      </header>

      <div class="section-heading">
        <div><p class="eyebrow">课堂活动</p><h2>按课堂步骤完成</h2></div>
      </div>

      <section class="module-grid" aria-label="课堂模块">
        <a class="module-card module-card--active" href="model-workbench.html">
          <span class="module-number">任务 1</span>
          <span class="module-icon module-icon--orange">↝</span>
          <h2>初始模型</h2>
          <p>摆出你认为合适的位置和路线。</p>
          <span class="module-action">开始建模 →</span>
        </a>

        <article class="module-card module-card--locked">
          <span class="module-number">任务 2</span>
          <span class="module-icon module-icon--violet">◎</span>
          <h2>AR 观察</h2>
          <p>观察消化器官的位置和连接。</p>
          <span class="module-action">待开启</span>
        </article>

        <article class="module-card module-card--locked">
          <span class="module-number">任务 3</span>
          <span class="module-icon module-icon--mint">◌</span>
          <h2>修正模型</h2>
          <p>根据观察到的证据修改模型。</p>
          <span class="module-action">即将解锁</span>
        </article>

        <article class="module-card module-card--locked">
          <span class="module-number">任务 4</span>
          <span class="module-icon module-icon--blue">◒</span>
          <h2>实体拼装</h2>
          <p>合作完成消化系统模型。</p>
          <span class="module-action">即将解锁</span>
        </article>

        <article class="module-card module-card--locked">
          <span class="module-number">任务 5</span>
          <span class="module-icon module-icon--violet">◒</span>
          <h2>食物的旅行</h2>
          <p>从第一人称体验食物的旅行。</p>
          <span class="module-action">即将解锁</span>
        </article>

    <section class="portrait-notice"><div><strong>请将平板竖过来</strong><span>竖屏后进入本课活动</span></div></section>
