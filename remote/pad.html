<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂遥控</title>
<link rel="stylesheet" href="pad.css?v=2">
<script defer src="../cloud-loader.js"></script>
</head>
<body>
<main>
<header><h1>课堂遥控</h1></header>
<section id="pairing-panel">
 <p>在教室大屏点「跟随 iPad」，把显示的六位配对码填在这里。</p>
 <form id="pairing" onsubmit="return false">
  <label>配对码 <input id="code" required maxlength="6" autocomplete="off" autocapitalize="none"></label>
  <button id="connect-button" type="submit" disabled>连接大屏</button>
 </form>
</section>
<p id="status" role="status" aria-live="polite">正在加载遥控页…</p>
<div id="remote-controls" hidden><nav id="phases" aria-label="课堂环节"></nav><section id="controls"></section><section id="stars"></section></div>
<noscript>请在浏览器中启用 JavaScript 后刷新。</noscript>
</main>
<script type="module">
 const status=document.getElementById('status');
 const timer=setTimeout(()=>{status.textContent='遥控页加载较慢，请检查网络或刷新。';},8000);
 import('./pad.js?v=6').then(()=>clearTimeout(timer)).catch(error=>{
  clearTimeout(timer);
  status.textContent='遥控程序加载失败，请刷新后重试。';
  console.error(error);
 });
</script>
</body>
</html>
